# Two-stage fine-tuning configuration for Swin-Tiny (or swap to vit_small_patch16_224.augreg_in21k_ft_in1k).
experiment_name: swin_tiny

model:
  backbone: swin_tiny_patch4_window7_224.ms_in22k_ft_in1k
  pretrained: true
  drop_rate: 0.2
  drop_path_rate: 0.2

training:
  batch_size: 32
  num_workers: 4
  amp: true
  grad_clip_norm: 1.0
  label_smoothing: 0.1
  use_class_weights: true
  ema:
    enabled: true
    decay: 0.999

  mixup:
    enabled: true
    mixup_alpha: 0.2
    cutmix_alpha: 1.0
    prob: 0.5
    switch_prob: 0.5

  stage1:
    epochs: 4
    lr: 8.0e-4
    weight_decay: 5.0e-2
    warmup_epochs: 1

  stage2:
    epochs: 16
    backbone_lr: 5.0e-5
    head_lr: 3.0e-4
    min_lr: 1.0e-6
    weight_decay: 5.0e-2
    warmup_epochs: 2
    early_stopping_patience: 5

