# Public datasets and canonical "Crop___Disease" mapping configuration.

sources:
  plantvillage:
    enabled: true
    domain: lab
    repo_url: https://github.com/spMohanty/PlantVillage-Dataset.git
    archive_url: https://github.com/spMohanty/PlantVillage-Dataset/archive/refs/heads/master.zip
    subpath: raw/color
    kaggle_dataset: abdallahalidev/plantvillage-dataset

  plantdoc:
    enabled: true
    domain: field
    repo_url: https://github.com/pratikkayal/PlantDoc-Dataset.git
    archive_url: https://github.com/pratikkayal/PlantDoc-Dataset/archive/refs/heads/master.zip
    subpaths: ["train", "test"]

  ip102:
    enabled: true
    domain: field
    kaggle_dataset: rtlmdd/ip102
    # By default keep top-K most frequent pest classes if using IP102 to prevent long-tail collapse;
    # set to null to include all 102 pest classes.
    top_k_classes: 15

  rice:
    enabled: false
    domain: field
    kaggle_dataset: vbookshelf/rice-leaf-diseases

  cassava:
    enabled: false
    domain: field
    kaggle_competition: cassava-leaf-disease-classification

  ood_non_plant:
    enabled: true
    # Uses torchvision CIFAR-10 non-plant classes (airplane, automobile, bird, cat, deer, dog, frog, horse, ship, truck)
    # as out-of-distribution negatives for OOD threshold tuning and optional plant-gate training.
    max_samples: 1500

