[project]
name = "crop-disease-classifier"
version = "1.0.0"
description = "End-to-end Crop Disease & Pest Classifier with calibrated ONNX inference, Grad-CAM explainability, FastAPI backend, and React frontend."
authors = [{ name = "Prakhar" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "venv",
  "data",
  "artifacts",
  "frontend",
  "mlruns",
  "wandb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["ml", "app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

